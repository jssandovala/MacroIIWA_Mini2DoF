controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz
    
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_controller:  
      type: joint_trajectory_controller/JointTrajectoryController

    joint_velocity_controller:  
      type: velocity_controllers/JointGroupVelocityController 
    
    joint_effort_controller:
      type: effort_controllers/JointGroupEffortController

joint_trajectory_controller: 
  ros__parameters:
    joints:
      - joint1
      - joint2
    command_interfaces:
      - position   
    state_interfaces:
      - position
joint_velocity_controllerr: 
  ros__parameters:
    joints:
      - joint1
      - joint2
    command_interfaces:
      - velocity   
    state_interfaces:
      - position
      - velocity
      - effort
    gains:      
      joint1:
        p: 0.05
        i: 0.05
        d: 0.05

joint_effort_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
    command_interfaces:
      - effort
    state_interfaces:
      - position
      - velocity
      - effort
      
